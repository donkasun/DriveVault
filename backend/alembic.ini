# Alembic configuration — wired to the app's DATABASE_URL (see docs/01-tech-spec.md).

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = ""

[loggers]
keys = root

[handlers]

[formatters]
keys = generic

[logger_root]
level = WARN
handlers =
formatter = generic

[logger_alchemy.migrations]
level = INFO
handlers =
qualname = alembic.runtime.migrations

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
